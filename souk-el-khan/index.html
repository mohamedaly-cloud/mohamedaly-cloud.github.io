<title>Souk el-Khan</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-sized column (title, HUD strip, square wooden board, shopkeeper strip) on a night-souk khayamiya ground. Single deliberate dark look. */
:root{
  --night:#1a1230; --night-2:#261a44; --brass:#e7b24a; --brass-dk:#8a5a1c;
  --cream:#fbefd6; --muted:#b9a9d6; --red:#e2483a; --green:#7fe08a; --ink:#140d22;
  --display:"Lalezar","Baloo Bhaijaan 2",system-ui,sans-serif;
  --body:"Baloo Bhaijaan 2",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--night)}
body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;color:var(--cream);font-family:var(--body);
  background-color:var(--night);
  background-image:
    radial-gradient(ellipse at 50% 0%,rgba(231,178,74,.16),transparent 60%),
    repeating-conic-gradient(from 45deg,rgba(231,178,74,.05) 0 25%,transparent 0 50%);
  background-size:100% 100%,34px 34px}
.app{height:100%;max-width:520px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;margin:0;text-align:center;color:var(--brass);text-shadow:0 2px 0 var(--brass-dk)}
h1 small{display:block;font-family:var(--body);font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.12em;text-shadow:none;margin-top:2px}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.stats{display:grid;gap:0}
.stat{display:flex;gap:6px;align-items:baseline}
.lbl{font-size:12px;color:var(--muted);font-weight:700}
.val{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.moves{width:74px;height:74px;border-radius:50%;display:grid;place-content:center;text-align:center;
  background:radial-gradient(circle at 50% 35%,#3d2c63,var(--night));border:3px solid var(--brass);
  box-shadow:0 0 0 3px var(--brass-dk),0 6px 14px rgba(0,0,0,.45)}
.moves b{font-family:var(--display);font-weight:400;font-size:34px;line-height:.9}
.moves span{font-size:11px;color:var(--muted);font-weight:700}
.moves.low{border-color:var(--red);animation:pulse .7s infinite alternate}
.goals{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.goal{display:flex;flex-direction:column;align-items:center;gap:0}
.goal canvas{width:36px;height:36px}
.goal b{font-family:var(--display);font-weight:400;font-size:18px;line-height:1}
.goal.done b{color:var(--green)}
.goal.bump{animation:bump .28s}
.stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
#board{display:block;touch-action:none;pointer-events:none;border-radius:18px;box-shadow:0 14px 34px rgba(0,0,0,.55)}
#board:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.keeper{display:flex;align-items:center;gap:10px}
.keeper canvas{width:52px;height:52px;flex:none}
.bubble{flex:1;min-width:0;position:relative;background:var(--cream);color:var(--ink);border-radius:14px;padding:6px 12px 8px;font-weight:700;font-size:15px;line-height:1.35}
.bubble::before{content:"";position:absolute;right:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:0;border-left-color:var(--cream)}
[dir=ltr] .bubble::before{right:auto;left:-7px;border:7px solid transparent;border-left:0;border-right-color:var(--cream)}
#lang{font-family:var(--display);font-size:19px}
.bubble .who{display:block;font-size:11px;font-weight:800;color:var(--brass-dk)}
.bubble.talk{animation:bump .25s}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:2px solid var(--brass-dk);background:var(--night-2);color:var(--brass);display:grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:focus-visible,.btn:focus-visible,.link:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.icon-btn[aria-pressed="true"] .wave{display:none}
[hidden]{display:none!important}
.vtest{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 0;font-size:14px;opacity:.85}
.hap{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,6,20,.74);backdrop-filter:blur(3px);z-index:5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:100%;max-width:340px;box-sizing:border-box;text-align:center;background:var(--night-2);border:2px solid var(--brass);border-radius:20px;padding:22px 20px;
  box-shadow:0 0 0 5px rgba(231,178,74,.15),0 20px 50px rgba(0,0,0,.6);animation:rise .3s ease-out}
.card h2{font-family:var(--display);font-weight:400;font-size:38px;line-height:1.1;margin:0 0 6px;color:var(--brass);text-wrap:balance}
.card p{margin:0 0 12px;font-size:16px;line-height:1.5}
.eyebrow{font-size:12px!important;font-weight:800;color:var(--muted);letter-spacing:.1em;margin-bottom:2px!important}
.how{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px;text-align:start;font-size:14px}
.how li{background:rgba(255,255,255,.05);border-radius:10px;padding:6px 10px}
.how b{color:var(--brass)}
.stars{font-size:44px;letter-spacing:6px;line-height:1;margin-bottom:8px;color:rgba(255,255,255,.15)}
.stars .on{color:var(--brass);text-shadow:0 0 14px rgba(231,178,74,.7)}
.btn{font-family:var(--display);font-size:24px;font-weight:400;color:var(--ink);background:linear-gradient(#ffd27a,#d9962f);border:0;border-radius:14px;padding:8px 30px 10px;cursor:pointer;box-shadow:0 4px 0 var(--brass-dk)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brass-dk)}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);font:700 14px var(--body);text-decoration:underline;cursor:pointer}
.boost[hidden]{display:none}
.boost{display:flex;align-items:center;justify-content:center;gap:10px}
.pill{font-family:var(--display);font-size:19px;height:44px;box-sizing:border-box;padding:0 12px;display:flex;align-items:center;gap:6px;background:var(--night-2);border:2px solid var(--brass-dk);border-radius:12px;font-variant-numeric:tabular-nums}
.bst{position:relative;font-size:22px}
.bst i{position:absolute;top:-7px;inset-inline-end:-7px;min-width:19px;height:19px;padding:0 4px;box-sizing:border-box;border-radius:10px;background:var(--red);color:#fff;font:800 12px/19px var(--body);font-style:normal}
.bst[aria-pressed="true"]{background:var(--brass);box-shadow:0 0 14px var(--brass)}
#board.aim{cursor:crosshair;outline:3px dashed var(--brass);outline-offset:3px}
.prize{font-size:84px;line-height:1.15;margin:4px 0 10px}
.prize.shake{animation:wob .6s infinite}
.prize.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
.meter{height:10px;border-radius:5px;background:rgba(255,255,255,.1);margin:0 24px 14px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,#ffd27a,#d9962f)}
@keyframes wob{25%{transform:rotate(-9deg) scale(1.05)}75%{transform:rotate(9deg)}}
@keyframes popin{from{transform:scale(.2);opacity:0}}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--red),0 0 18px rgba(226,72,58,.7)}}
@keyframes bump{50%{transform:scale(1.25)}}
@keyframes rise{from{transform:translateY(16px) scale(.96);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div class="app" lang="ar" dir="rtl">
  <h1>سوق الخان<small>SOUK EL-KHAN</small></h1>
  <header class="hud">
    <div class="stats">
      <div class="stat"><span class="lbl">المرحلة</span><span class="val" id="lvl">١</span></div>
      <div class="stat"><span class="lbl">النقط</span><span class="val" id="score">٠</span></div>
    </div>
    <div class="moves" id="movesBox"><b id="moves">٠</b><span>حركات</span></div>
    <div class="goals" id="goals" aria-label="الهدف"></div>
  </header>
  <div class="stage"><canvas id="board" tabindex="0" aria-label="لوحة اللعب: اسحب أي حاجة لجنبها"></canvas></div>
  <div class="boost" hidden>
    <span class="pill" id="coinPill">🪙 <b id="coins">٠</b></span>
    <button class="icon-btn bst" id="hammer" aria-pressed="false">🔨<i></i></button>
    <button class="icon-btn bst" id="shuf">🔀<i></i></button>
    <span class="pill" id="chestPill">🎁 <b id="chestN">٠</b></span>
  </div>
  <footer class="keeper">
    <canvas id="keeperCv" aria-hidden="true"></canvas>
    <div class="bubble" id="bubble" aria-live="polite"><span class="who">عم متولي</span><span id="sayText">نورت السوق يا باشا!</span></div>
    <button class="icon-btn" id="lang">EN</button>
    <button class="icon-btn" id="mute"aria-pressed="false" aria-label="الصوت">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="vib" aria-pressed="false" aria-label="إيقاف الاهتزاز">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="4" width="8" height="16" rx="2"/><path class="wave" d="M4.5 9v6M19.5 9v6M2 11v2M22 11v2"/></svg>
    </button>
  </footer>
</div>
<div class="ov" id="ov"><div class="card" id="card"></div></div>

<script>
(()=>{
'use strict';
const N=8, T=6;
const COLORS=['#f5b83a','#a55a32','#e2482c','#d23a86','#2f7bd6','#45a84e'];
let lang=''; try{lang=localStorage.getItem('soukKhan.lang')||'';}catch(_){}
const EN=(lang||(/^ar/i.test(navigator.language)?'ar':'en'))==='en';
const NAMES=EN?['lanterns','dates','spices','hibiscus','blue beads','mint']:['فانوس','بلحة','بهارات','كركديه','خرزة زرقا','نعناع'];
const PRAISE=EN?['Nice!','Wow!','Bravo, boss!','Brilliant!','So sweet!','Unreal!']:['حلو!','يا سلام!','عاش يا معلم!','الله ينور!','إيه الحلاوة دي!','ولا في الأحلام!'];
const KEEPER=EN?{
  combo:['Hands of silk!','Now that is a master move!','Look at you, usta!'],
  low:['Only a few moves left, focus!','Easy... think before you move'],
  win:['May your shop keep growing!','The shop shines thanks to you!','Well earned, boss!'],
  lose:['Never mind, next time is sweeter','Market life: some days up, some days down'],
  bad:['Nope, that one won\'t work','No three here, habibi'],
  shoe:['Grandma\'s slipper! Nothing stands in its way','Duck! The slipper is flying!'],
  shuffle:['The goods got mixed up, let me sort them again'],
}:{
  combo:['إيدك تتلف في حرير!','دي حركة معلمين!','الله عليك يا أسطى!'],
  low:['فاضل حركات قليلة، ركّز يا بطل','على مهلك... فكّر قبل ما تحرّك'],
  win:['ربنا يزيد ويبارك!','الدكان نوّر بيك!','حلال عليك يا معلم!'],
  lose:['ولا يهمك، المرة الجاية أحلى','معلش، السوق كده: يوم لك ويوم عليك'],
  bad:['لأ لأ، دي مش هتنفع','مفيش تلاتة هنا يا حبيبي'],
  shoe:['شبشب تيتة! محدش يقف قدامه','حاسب! الشبشب طاير!'],
  shuffle:['البضاعة اتلخبطت، أرتبها لك تاني'],
};
const S2=s=>s.split(' ');
const LEVELS=[
  {name:'خان الخليلي',moves:20,goals:{0:15},say:'الفوانيس اتلخبطت! لِم لي ١٥ فانوس',en:['Khan el-Khalili','The lanterns are a mess! Get me 15 lanterns']},
  {name:'سوق العطارين',moves:22,goals:{1:14,5:14},say:'الزباين عايزة بلح ونعناع',en:['Attarine Market','The customers want dates and mint']},
  {name:'الصاغة',moves:24,sand:S2('00000000 00000000 00111100 00111100 00111100 00111100 00000000 00000000'),say:'الرملة غطّت البلاط، وفّق فوقها تنضف',en:['Goldsmiths\' Row','Sand covered the tiles: match on top to clean it']},
  {name:'زنقة الستات',moves:25,goals:{4:12},sand:S2('22000022 21000012 00000000 00000000 00000000 00000000 21000012 22000022'),say:'الخرز الأزرق بيحمي الدكان من العين',en:['Zanqet el-Settat','Blue beads guard the shop from the evil eye']},
  {name:'المنشية',moves:30,sand:S2('11111111 11111111 11222211 11222211 11222211 11222211 11111111 11111111'),say:'آخر مرحلة النهارده: السوق كله رملة!',en:['Manshiya','Last level for today: the whole souk is sand!']},
];
if(EN) LEVELS.forEach(L=>{[L.name,L.say]=L.en;});

const $=s=>document.querySelector(s);
const ar=n=>Number(n).toLocaleString(EN?'en-US':'ar-EG');
const AND=EN?' and ':' و ', SAND=EN?'sand':'رملة';
const rnd=n=>Math.random()*n|0;
const K=(r,c)=>r*N+c, R_=k=>(k/N)|0, C_=k=>k%N;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let board=[], sand=[], lvl=0, moves=0, score=0, goals={}, sandGoal=false;
let busy=true, over=true, sel=-1, cur=27, kbd=false, uid=0, lastAct=0, hint=null, shake=0, time=0;
const dying=[], parts=[], beams=[], rings=[], zaps=[], texts=[];

const at=k=>board[R_(k)][C_(k)];
const eachCell=f=>{for(let k=0;k<N*N;k++) f(k);};
const newPiece=(t,c,r)=>({t,sp:null,x:c,y:r,vy:0,sq:0,born:0,spent:false,id:++uid});

/* ---------- art ---------- */
const cv=$('#board'), ctx=cv.getContext('2d'), stage=$('.stage');
let B=320, F=10, S=37.5, dpr=1, bg=null; const spr=[], sandSpr=[];
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function off(w,h){const o=document.createElement('canvas');o.width=Math.ceil(w*dpr);o.height=Math.ceil(h*dpr);const g=o.getContext('2d');g.scale(dpr,dpr);return [o,g];}
function lin(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));return gr;}
function shadowOn(g,u){g.shadowColor='rgba(0,0,0,.38)';g.shadowBlur=u*.2;g.shadowOffsetY=u*.09;}
function shadowOff(g){g.shadowColor='transparent';}

function drawPiece(g,t,u){
  g.save(); g.lineJoin='round'; g.lineCap='round';
  if(t===0){ // fanous
    g.strokeStyle='#7a4a12'; g.lineWidth=u*.09; g.beginPath(); g.arc(0,-u*.92,u*.11,0,7); g.stroke();
    const body=new Path2D(); body.moveTo(-u*.5,-u*.45); body.lineTo(u*.5,-u*.45); body.lineTo(u*.66,u*.08); body.lineTo(u*.4,u*.62); body.lineTo(-u*.4,u*.62); body.lineTo(-u*.66,u*.08); body.closePath();
    const gr=g.createRadialGradient(0,0,u*.05,0,0,u*.8); gr.addColorStop(0,'#fff4b8'); gr.addColorStop(.5,'#f7b733'); gr.addColorStop(1,'#c2650f');
    shadowOn(g,u); g.fillStyle=gr; g.fill(body); shadowOff(g);
    g.fillStyle='rgba(214,52,52,.5)'; g.beginPath(); g.moveTo(-u*.44,-u*.38); g.lineTo(-u*.06,-u*.38); g.lineTo(-u*.06,u*.02); g.lineTo(-u*.56,u*.02); g.fill();
    g.fillStyle='rgba(30,140,90,.5)'; g.beginPath(); g.moveTo(u*.06,u*.14); g.lineTo(u*.56,u*.14); g.lineTo(u*.36,u*.55); g.lineTo(u*.06,u*.55); g.fill();
    g.strokeStyle='#8a5216'; g.lineWidth=u*.07; g.stroke(body);
    g.beginPath(); g.moveTo(0,-u*.45); g.lineTo(0,u*.62); g.moveTo(-u*.66,u*.08); g.lineTo(u*.66,u*.08); g.stroke();
    g.fillStyle=lin(g,0,-u*.86,0,-u*.42,['#e0a040','#7a4a12']); g.beginPath(); g.moveTo(-u*.54,-u*.42); g.quadraticCurveTo(-u*.45,-u*.86,0,-u*.86); g.quadraticCurveTo(u*.45,-u*.86,u*.54,-u*.42); g.closePath(); g.fill();
    g.fillStyle='#7a4a12'; g.beginPath(); g.moveTo(-u*.32,u*.6); g.lineTo(u*.32,u*.6); g.lineTo(u*.2,u*.84); g.lineTo(-u*.2,u*.84); g.fill();
    g.fillStyle='rgba(255,255,255,.6)'; g.beginPath(); g.ellipse(-u*.3,-u*.18,u*.06,u*.15,0,0,7); g.fill();
  } else if(t===1){ // dates
    const D=(x,y,rot)=>{g.save(); g.translate(x,y); g.rotate(rot);
      g.fillStyle=lin(g,-u*.25,-u*.45,u*.25,u*.45,['#d0884c','#93492a','#52240f']);
      shadowOn(g,u); g.beginPath(); g.ellipse(0,0,u*.28,u*.5,0,0,7); g.fill(); shadowOff(g);
      g.strokeStyle='rgba(40,14,4,.55)'; g.lineWidth=u*.045; g.stroke();
      g.strokeStyle='rgba(50,20,8,.4)'; g.beginPath(); g.moveTo(-u*.06,-u*.28); g.quadraticCurveTo(u*.06,0,-u*.04,u*.28); g.stroke();
      g.fillStyle='rgba(255,232,190,.55)'; g.beginPath(); g.ellipse(-u*.11,-u*.2,u*.05,u*.14,0,0,7); g.fill(); g.restore();};
    D(-u*.38,u*.14,-.5); D(u*.38,u*.14,.5); D(0,-u*.08,0);
    g.strokeStyle='#d9b26a'; g.lineWidth=u*.08; g.beginPath(); g.moveTo(0,-u*.56); g.quadraticCurveTo(u*.05,-u*.78,u*.24,-u*.88); g.stroke();
  } else if(t===2){ // spice cone on a copper plate
    shadowOn(g,u); g.fillStyle=lin(g,-u*.8,0,u*.8,0,['#e8a060','#a8602c','#6e3a18']); g.beginPath(); g.ellipse(0,u*.62,u*.82,u*.2,0,0,7); g.fill(); shadowOff(g);
    const cone=new Path2D(); cone.moveTo(-u*.7,u*.58); cone.quadraticCurveTo(-u*.36,0,-u*.07,-u*.78); cone.quadraticCurveTo(0,-u*.88,u*.07,-u*.78); cone.quadraticCurveTo(u*.36,0,u*.7,u*.58); cone.quadraticCurveTo(0,u*.74,-u*.7,u*.58);
    g.fillStyle=lin(g,-u*.7,0,u*.7,0,['#ff8a45','#e2482c','#9e2316']); g.fill(cone);
    g.save(); g.clip(cone); let s=7; const sr=()=>(s=(s*16807)%2147483647)/2147483647;
    for(let i=0;i<26;i++){g.fillStyle=i%2?'rgba(255,190,120,.7)':'rgba(110,20,10,.55)'; g.beginPath(); g.arc((sr()-.5)*u*1.3,(sr()-.35)*u*1.3,u*.035,0,7); g.fill();}
    g.restore();
    g.strokeStyle='rgba(255,225,190,.55)'; g.lineWidth=u*.07; g.beginPath(); g.moveTo(-u*.1,-u*.62); g.quadraticCurveTo(-u*.3,0,-u*.48,u*.46); g.stroke();
  } else if(t===3){ // karkade (hibiscus)
    shadowOn(g,u);
    for(let i=0;i<5;i++){g.save(); g.rotate(i*Math.PI*2/5);
      const gr=g.createRadialGradient(0,0,u*.05,0,-u*.35,u*.85); gr.addColorStop(0,'#ff9cc8'); gr.addColorStop(.55,'#d23a86'); gr.addColorStop(1,'#8e1452');
      g.fillStyle=gr; g.beginPath(); g.ellipse(0,-u*.44,u*.34,u*.46,0,0,7); g.fill(); g.restore();}
    shadowOff(g);
    g.fillStyle='#5a0a2c'; g.beginPath(); g.arc(0,0,u*.2,0,7); g.fill();
    g.strokeStyle='#ffd94a'; g.lineWidth=u*.07; g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(u*.02,-u*.35,u*.18,-u*.58); g.stroke();

  memb.forEach((l,k)=>{if(l.length>1&&l.every(i=>!used.has(i))){l.forEach(i=>used.add(i)); make.push({k,t:at(k).t,sp:'b'});}});

  for(let i=dying.length;i--;){dying[i].t+=dt/.24; if(dying[i].t>=1) dying.splice(i,1);}
  for(let i=parts.length;i--;){const q=parts[i]; q.vy+=S*28*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.rot+=q.vr*dt; q.life-=dt; if(q.life<=0) parts.splice(i,1);}

function drawP(c,p,cx,cy,sc,alpha){
  const sq=p.sq>0?Math.sin(p.sq*Math.PI)*.16:0, bo=p.born>0?1+Math.sin(p.born*Math.PI)*.35:1;

  c.drawImage(spr[p.sp==='r'?6:p.t],cx-w/2,cy+S*sc/2-h-(bo-1)*S*sc/2,w,h);
  if(p.sp==='h'||p.sp==='v'){
    c.save(); c.translate(cx,cy); c.scale(sc,sc); if(p.sp==='v') c.rotate(Math.PI/2);
    c.fillStyle='rgba(255,255,255,.95)'; c.shadowColor='rgba(255,220,120,1)'; c.shadowBlur=S*.15;

    for(const s of [-1,1]){c.beginPath(); c.moveTo(s*S*.48,0); c.lineTo(s*S*.35,-S*.11); c.lineTo(s*S*.35,S*.11); c.closePath(); c.fill();}
    c.restore();
  } else if(p.sp==='b'){
    c.save(); c.strokeStyle='#ffe08a'; c.lineWidth=S*.07; c.shadowColor='#ffcc4d'; c.shadowBlur=S*.3;
    c.beginPath(); c.arc(cx,cy,S*.46*sc*(1+.05*Math.sin(time*7)),0,7); c.stroke(); c.restore();
  }

}
function draw(){
  const c=ctx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,B,B);
  if(shake>0) c.translate((Math.random()-.5)*shake*S*.3,(Math.random()-.5)*shake*S*.3);
  if(bg) c.drawImage(bg,0,0,B,B);
  for(let r=0;r<N;r++) for(let k=0;k<N;k++) if(sand[r]&&sand[r][k]>0) c.drawImage(sandSpr[sand[r][k]],F+k*S,F+r*S,S,S);
  c.save(); c.beginPath(); c.rect(F,F,S*N,S*N); c.clip();
  for(let r=0;r<N;r++) for(let k=0;k<N;k++){
    const p=board[r]&&board[r][k]; if(!p) continue;
    let ox=0, oy=0, sc=1; const key=K(r,k);
    if(hint&&(key===hint[0]||key===hint[1])){const o=key===hint[0]?hint[1]:hint[0], m=Math.max(0,Math.sin(time*9))*S*.09; ox=Math.sign(C_(o)-k)*m; oy=Math.sign(R_(o)-r)*m;}
    if(key===sel) sc=1.12+Math.sin(time*8)*.03;
    drawP(c,p,px(p.x)+ox,px(p.y)+oy,sc,1);
  }
  for(const d of dying){const t=d.t, sc=t<.35?1+t/.35*.25:1.25*(1-(t-.35)/.65); drawP(c,d.p,px(d.p.x),px(d.p.y),Math.max(.01,sc),1-t*t);}

  if(kbd&&!over){c.strokeStyle='rgba(255,224,138,.9)'; c.lineWidth=2; c.setLineDash([5,4]); rr(c,F+C_(cur)*S+4,F+R_(cur)*S+4,S-8,S-8,S*.16); c.stroke(); c.setLineDash([]);}

    if(b.o==='h'){const y=px(b.r), g=c.createLinearGradient(0,y-w/2,0,y+w/2); g.addColorStop(0,'rgba(255,190,70,0)'); g.addColorStop(.5,`rgba(255,246,215,${a})`); g.addColorStop(1,'rgba(255,190,70,0)'); c.fillStyle=g; c.fillRect(F,y-w/2,S*N,w);}
    else {const x=px(b.c), g=c.createLinearGradient(x-w/2,0,x+w/2,0); g.addColorStop(0,'rgba(255,190,70,0)'); g.addColorStop(.5,`rgba(255,246,215,${a})`); g.addColorStop(1,'rgba(255,190,70,0)'); c.fillStyle=g; c.fillRect(x-w/2,F,w,S*N);}}

  for(const z of zaps){const x0=px(z.c0), y0=px(z.r0), x1=px(z.c1), y1=px(z.r1); c.strokeStyle=`rgba(255,255,255,${1-z.t})`; c.lineWidth=S*.07;
    c.beginPath(); c.moveTo(x0,y0); c.lineTo((x0+x1)/2+(Math.random()-.5)*S*.5,(y0+y1)/2+(Math.random()-.5)*S*.5); c.lineTo(x1,y1); c.stroke();}
  c.restore();

    const t=x.t, k=Math.min(1,t/.12)*(1+.18*Math.max(0,1-t*4)), a=t>.8?Math.max(0,(1.1-t)/.3):1, size=x.size*k;

    const y=x.y-S*.7*t; c.lineJoin='round'; c.lineWidth=size*.16; c.strokeStyle='#2a1406'; c.strokeText(x.s,x.x,y);

/* ---------- self-check: match rules ---------- */
(function selfTest(){
  const mk=marks=>{board=[]; for(let r=0;r<N;r++){const row=[]; for(let c=0;c<N;c++) row.push(newPiece((2*r+c)%5+1,c,r)); board.push(row);} marks.forEach(([r,c])=>board[r][c].t=0);};
  mk([[0,0],[0,1],[0,2],[0,3],[0,4]]); let P=plan(runs(),[]); console.assert(P.make.length===1&&P.make[0].sp==='r','5 in a row makes a shebsheb');
  mk([[0,0],[0,1],[0,2],[1,0],[2,0]]); P=plan(runs(),[]); console.assert(P.make.length===1&&P.make[0].sp==='b'&&P.make[0].k===0&&P.clear.size===5,'L makes a bomb at the corner');
  mk([[3,2],[3,3],[3,4],[3,5]]); P=plan(runs(),[K(3,4)]); console.assert(P.make.length===1&&P.make[0].sp==='h'&&P.make[0].k===K(3,4),'4 in a row makes a line where you swapped');
  mk([]); console.assert(runs().length===0,'filler board has no matches');
  fillBoard(); console.assert(runs().length===0&&findMove(),'new board has no matches and has a move');
  board=[];
})();
